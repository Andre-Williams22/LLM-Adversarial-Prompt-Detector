# Cloud Build pipeline: build the container, push it to Artifact Registry,
# and roll it out to Cloud Run. Triggered on push to the default branch.

substitutions:
  _REGION: 'us-west1'
  _SERVICE_NAME: 'adversarial-prompt-detector'
  _REPOSITORY: 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/llm-adversarial-prompt-detector'

steps:
  # Build. The root Dockerfile and .dockerignore are the single source of truth.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '-t'
      - '${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: push-build-id
    args: ['push', '${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-latest
    args: ['push', '${_REPOSITORY}/${_SERVICE_NAME}:latest']

  # Deploy. min-instances=1 keeps one warm replica so users never pay the
  # model-loading cold start; cpu-boost shortens that load on scale-out.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
      - '--platform=managed'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=4Gi'
      - '--cpu=4'
      - '--cpu-boost'
      - '--concurrency=100'
      - '--min-instances=1'
      - '--max-instances=12'
      - '--timeout=3600'
      - '--startup-probe-timeout=600'
      - '--startup-probe-period=30'
      - '--startup-probe-failure-threshold=20'
      - '--set-env-vars=TOKENIZERS_PARALLELISM=false,PYTORCH_ENABLE_MPS_FALLBACK=1,HF_HUB_DISABLE_SYMLINKS_WARNING=1,PORT=80'

options:
  machineType: 'E2_HIGHCPU_8'
  env:
    - 'DOCKER_BUILDKIT=1'

timeout: '3600s'

images:
  - '${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REPOSITORY}/${_SERVICE_NAME}:latest'
